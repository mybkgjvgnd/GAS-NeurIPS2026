# =============================================
# GAS - Fruit-306 Configuration (NeurIPS 2026)
# =============================================

dataset:
  name: fruit306
  data_root: ./data/Fruit-306
  num_classes: 306
  img_size: 224
  batch_size: 64
  num_workers: 8
  pin_memory: true

model:
  backbone_names: ["densenet201", "efficientnet_b7", "vit_base_patch16_224"]
  pretrained: true
  feature_dim: 768                # 统一映射后的特征维度
  ensemble_method: "weighted"     # or "average"

gas:
  prototype:
    momentum: 0.01                  # EMA momentum α
    temperature: 0.07
    use_density_weight: true
  uncertainty:
    gamma: 2.0                      # scaling factor in formula (6)
    use_calibrated: true
  arbitration:
    tau: 0.65                       # uncertainty threshold
    q_min: 70                       # VLM minimum confidence
    top_k: [1, 3, 5]                # dynamic candidate set sizes
    vlm_model: "Qwen/Qwen2.5-VL-7B-Instruct"
    vlm_temperature: 0.0
    use_context_aware_prompt: true

training:
  epochs: 50
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.0001
  lr_scheduler: cosine
  warmup_epochs: 5
  seed: 42
  gpu_ids: [0,1,2,3]
  mixed_precision: true

evaluation:
  save_best: true
  metrics: ["top1", "top3", "top5", "ece", "auroc"]

paths:
  output_dir: ./output/fruit306
  checkpoint_dir: ./checkpoints/fruit306
  log_dir: ./logs/fruit306

debug:
  enable: false
  subset: false